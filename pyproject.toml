[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mira-reproceso"
version = "0.1.0"
description = "Servicio mínimo de evaluación de elegibilidad de reprocesamiento para MIRA CU-2"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "openpyxl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
